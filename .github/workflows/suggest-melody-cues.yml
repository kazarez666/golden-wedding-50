name: Suggest provisional music cues
on:
  push:
    paths:
      - 'scripts/suggest-melody-cues.mjs'
      - 'scripts/inspect-unmatched-cues.mjs'
      - '.github/workflows/suggest-melody-cues.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-lyrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Cloudinary manifest for existing audio
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          try{
            const url='https://res.cloudinary.com/t8dsuxni/video/list/golden_wedding_50_family_2026.json';
            const res=await fetch(url,{signal:AbortSignal.timeout(11000)});
            if(!res.ok){console.log('CLOUDINARY_MANIFEST HTTP',res.status);process.exit(0);}
            const {resources=[]}=await res.json();
            const melodies=resources.filter(x=>x.context?.custom?.slot?.startsWith('melody-')||x.context?.slot?.startsWith('melody-'));
            console.log('CLOUDINARY_MANIFEST resources',resources.length,'melodies',melodies.length,'slots',melodies.map(x=>({slot:x.context?.custom?.slot||x.context?.slot,version:x.version,format:x.format,duration:x.duration})));
          }catch(err){console.log('CLOUDINARY_MANIFEST_ERROR',String(err).slice(0,180))}
          EOF
      - name: Search synchronized lyrics and infer chorus-time candidates
        run: node scripts/suggest-melody-cues.mjs
      - name: Search alternate artist spellings for unmatched songs
        run: node scripts/inspect-unmatched-cues.mjs
