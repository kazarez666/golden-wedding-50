name: Verify contest art visually
on:
  push:
    paths:
      - '.github/workflows/design-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Capture ceremony announcement layouts
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/golden-preview.log 2>&1 &
          sleep 2
          node <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1,reducedMotion:'reduce'});
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              for(const idx of [6,7,8]){
                await page.locator('.section-item[data-value="'+idx+'"]').click();
                await page.waitForFunction(i=>document.querySelector('.stage')?.dataset.scene===['pairs','salads','word'][i-6],idx);
                await page.locator('.announcement-title').waitFor();
                await page.waitForTimeout(150);
                const shot=await page.screenshot({type:'jpeg',quality:64,animations:'disabled'});
                console.log('CONTEST_PREVIEW_'+(idx+1)+'='+shot.toString('base64'));
              }
              for(const idx of [2,3,5,9]){
                await page.locator('.section-item[data-value="'+idx+'"]').click();
                await page.waitForFunction(expected=>document.querySelector('.stage')?.dataset.scene===expected,
                  ['entrance','welcome','wedding','interviews','movies','melodies','pairs','salads','word','silhouettes'][idx]);
                await page.waitForTimeout(150);
                const shot=await page.screenshot({type:'jpeg',quality:60,animations:'disabled'});
                console.log('MEDIA_PREVIEW_'+(idx+1)+'='+shot.toString('base64'));
              }
              await page.close();
              const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,reducedMotion:'reduce'});
              await mobile.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              for(const idx of [6,7,8]){
                await mobile.locator('#mobile-stage-select').selectOption(String(idx));
                await mobile.waitForFunction(expected=>document.querySelector('.stage')?.dataset.scene===expected,
                  ['entrance','welcome','wedding','interviews','movies','melodies','pairs','salads','word','silhouettes'][idx]);
                await mobile.locator('.announcement-title').waitFor();
                const shot=await mobile.screenshot({type:'jpeg',quality:61,animations:'disabled'});
                console.log('MOBILE_PREVIEW_'+(idx+1)+'='+shot.toString('base64'));
              }
              await mobile.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
