name: Browser UI smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'editorial-design-v1.2.css'
      - 'welcome-gold-numeral-v1.4.css'
      - 'cinematic-edition-v1.5.css'
      - 'golden-motion-v1.6.css'
      - 'single-frame-gold-wipes-v1.7.css'
      - 'melody-show-v1.9.css'
      - 'golden-layout-fixes-v2.5.css'
      - 'ceremony-ornaments-v2.6.css'
      - 'asymmetric-contests-v2.7.css'
      - 'assets/ornament-*.svg'
      - '.github/workflows/browser-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check desktop / mobile UI
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/wedding-server.log 2>&1 &
          sleep 2
          node <<'EOF'
          const {chromium} = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              for(const viewport of [{width:1440,height:900},{width:390,height:844},{width:320,height:700}]){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
                await page.locator('.stage-content').waitFor();
                // The first slide uses staggered entrance animations; inspect final layout,
                // not elements mid-transition while they are translated down by 18px.
                await page.locator('.stage-content').evaluate(el=>Promise.all(
                  el.getAnimations({subtree:true}).map(animation=>animation.finished.catch(()=>{}))));
                if(viewport.width>800){
                  const rail=await page.evaluate(()=>{
                    const sidebar=document.querySelector('.sidebar-bottom');
                    const bottom=document.querySelector('#controlbar');
                    return {sidebarY:sidebar.getBoundingClientRect().top,
                      footerY:bottom.getBoundingClientRect().top,
                      text:sidebar.textContent.trim(),
                      line:getComputedStyle(sidebar).borderTopWidth,
                      footerLine:getComputedStyle(bottom).borderTopWidth};
                  });
                  assert.equal(rail.text,'','Version label must not appear in sidebar');
                  assert(Math.abs(rail.sidebarY-rail.footerY)<1.5,'Sidebar and footer gold lines are not aligned');
                  assert.equal(rail.line,rail.footerLine);
                }
                // Public-facing stage 1 has a march play button, not media-upload controls.
                assert.equal(await page.locator('[data-action="march-toggle"]').count(),1);
                assert.equal(await page.locator('.stage-content [data-file-key]').count(),0);
                assert(!((await page.locator('.stage-content').textContent()).includes('Загрузить музыку')));
                const opening=await page.evaluate(()=>{
                  const card=document.querySelector('.stage-content');
                  const button=card.querySelector('[data-action="march-toggle"]');
                  const footer=card.querySelector('.stage-bottom-fine');
                  const stage=document.querySelector('.stage');
                  const ornament=getComputedStyle(card,'::before');
                  return {
                    cardH:card.getBoundingClientRect().height,
                    stageH:stage.getBoundingClientRect().height,
                    btnBottom:button.getBoundingClientRect().bottom,
                    footerTop:footer.getBoundingClientRect().top,
                    ornamentTop:parseFloat(ornament.top),
                    ornamentLeft:parseFloat(ornament.left)
                  };
                });
                assert(opening.footerTop>=opening.btnBottom+5,'Opening footer overlaps the Mendelssohn button');
                assert(opening.ornamentTop>=0&&opening.ornamentLeft>=0,'Botanical ornament escapes the first frame');
                if(viewport.width>800)assert(opening.cardH<opening.stageH*.94,'Opening frame is still excessively tall');
                await page.keyboard.press('ArrowRight');
                await page.locator('.gold-wipe-scene').waitFor({state:'visible'});
                await page.locator('.gold-wipe-scene').waitFor({state:'detached'});
                await page.locator('.welcome-editorial').waitFor();
                const screen=await page.evaluate(()=>{
                  const panel=document.querySelector('.welcome-editorial');
                  return {width:document.documentElement.scrollWidth,
                    panelWidth:panel.getBoundingClientRect().width,
                    bg:getComputedStyle(panel).backgroundColor,
                    fonts:getComputedStyle(panel.querySelector('.welcome-person')).color,
                    numeral:getComputedStyle(panel.querySelector('.welcome-figure')).color,
                    numeralBackground:getComputedStyle(panel.querySelector('.welcome-figure')).backgroundColor,
                    numeralFill:getComputedStyle(panel.querySelector('.welcome-figure')).webkitTextFillColor,
                    borderCount:(getComputedStyle(panel).borderTopWidth),
                    panelOutline:getComputedStyle(panel).outlineStyle,
                    surnameFont:getComputedStyle(panel.querySelector('.welcome-surname')).fontFamily,
                    nameFont:getComputedStyle(panel.querySelector('.welcome-person')).fontFamily,
                    surnameSize:parseFloat(getComputedStyle(panel.querySelector('.welcome-surname')).fontSize),
                    nameSize:parseFloat(getComputedStyle(panel.querySelector('.welcome-person')).fontSize)};
                });
                assert(screen.width <= viewport.width+2,`Horizontal page overflow at ${viewport.width}: ${screen.width}`);
                assert.equal(screen.bg,'rgb(254, 244, 220)');
                assert.equal(screen.fonts,'rgb(63, 1, 13)');
                assert.equal(screen.numeral,'rgb(215, 176, 82)');
                assert.equal(screen.numeralFill,'rgb(215, 176, 82)');
                assert.equal(screen.numeralBackground,'rgba(0, 0, 0, 0)');
                if(viewport.width>800)assert(screen.panelWidth<=1045,'Welcome border should sit nearer to names');
                const figureTop=await page.locator('.welcome-figure').evaluate(el=>({
                  marginTop:getComputedStyle(el).marginTop,
                  paddingTop:getComputedStyle(el).paddingTop
                }));
                assert(parseFloat(figureTop.marginTop)<=0,'Welcome gold 50 needs a compact upper gap');
                assert.equal(figureTop.paddingTop,'0px');
                assert.equal(screen.surnameFont,screen.nameFont);
                assert(screen.surnameSize>screen.nameSize,'Surname should be larger than the names');
                assert.equal(screen.panelOutline,'none');
                await page.keyboard.press('b');
                await page.locator('#ambient-screen:not([hidden])').waitFor();
                const ambient=await page.evaluate(()=>{
                  const overlay=document.getElementById('ambient-screen');
                  const inner=overlay.querySelector('.ambient-screen-content');
                  return {outer:getComputedStyle(overlay).backgroundColor,
                    inner:getComputedStyle(inner).backgroundColor,
                    name:getComputedStyle(inner.querySelector('.ambient-persons')).color,
                    border:getComputedStyle(inner).borderTopColor,
                    gold50:getComputedStyle(inner.querySelector('.ambient-big50')).color,
                    numeralFill:getComputedStyle(inner.querySelector('.ambient-big50')).webkitTextFillColor,
                    numeralBackground:getComputedStyle(inner.querySelector('.ambient-big50')).backgroundColor,
                    surnameFont:getComputedStyle(inner.querySelector('.ambient-family')).fontFamily,
                    nameFont:getComputedStyle(inner.querySelector('.ambient-persons')).fontFamily,
                    surnameSize:parseFloat(getComputedStyle(inner.querySelector('.ambient-family')).fontSize),
                    nameSize:parseFloat(getComputedStyle(inner.querySelector('.ambient-persons')).fontSize),
                    outline:getComputedStyle(inner).outlineStyle,
                    shadow:getComputedStyle(inner).boxShadow,
                    width:document.documentElement.scrollWidth};
                });
                assert.deepEqual([ambient.outer,ambient.inner,ambient.name,ambient.border],
                  ['rgb(63, 1, 13)','rgb(254, 244, 220)','rgb(63, 1, 13)','rgb(215, 176, 82)']);
                assert.equal(ambient.gold50,'rgb(215, 176, 82)');
                assert.equal(ambient.numeralFill,'rgb(215, 176, 82)');
                assert.equal(ambient.numeralBackground,'rgba(0, 0, 0, 0)');
                assert.equal(ambient.surnameFont,ambient.nameFont);
                assert(ambient.surnameSize>ambient.nameSize,'Backdrop surname needs a larger headline');
                assert.equal(ambient.outline,'none');
                assert.equal(ambient.shadow,'none');
                assert(ambient.width <= viewport.width+2,`Ambient overflow at ${viewport.width}`);
                await page.keyboard.press('Escape');
                assert(await page.locator('#ambient-screen').evaluate(el=>el.hidden));
                if(viewport.width>800){
                  await page.locator('.topbar [data-action="menu-toggle"]').click();
                } else {
                  await page.locator('.topbar [data-action="menu-toggle"]').click();
                }
                assert(!(await page.locator('#host-menu').evaluate(el=>el.hidden)));
                await page.keyboard.press('Escape');
                assert(await page.locator('#host-menu').evaluate(el=>el.hidden));
                // Wedding-video screen is playback only, without upload prompts.
                if(viewport.width<=800)await page.locator('#mobile-stage-select').selectOption('2');
                else await page.locator('.section-item[data-value="2"]').click();
                await page.locator('video[data-player="wedding"]').waitFor();
                assert.equal(await page.locator('.ceremony-video-screen [data-file-key="wedding"]').count(),1);
                assert((await page.locator('.ceremony-video-screen .eyebrow').textContent()).includes('ПАВЛА СЕМЁНОВИЧА И ОЛЬГИ ЛЕОНИДОВНЫ'));
                const weddingOrnament=await page.locator('.ceremony-video-screen').evaluate(el=>{
                  const branch=getComputedStyle(el,'::before');
                  return {right:parseFloat(branch.right),top:parseFloat(branch.top),
                    width:parseFloat(branch.width),image:branch.backgroundImage};
                });
                assert(weddingOrnament.right>=0&&weddingOrnament.top>=0,'Wedding botanical should stay inside frame');
                assert(weddingOrnament.width>=(viewport.width>800?105:55)&&weddingOrnament.width<180,'Wedding botanical should be clearly visible but stay in its corner');
                assert((await page.locator('.ceremony-video-upload').textContent()).includes('Загрузить свадебный ролик'));
                assert.equal(await page.locator('.media-prompt').count(),0);
                // Validate interview-to-interview transitions, shared volume and no autoplay.
                if(viewport.width<=800)await page.locator('#mobile-stage-select').selectOption('3');
                else await page.locator('.section-item[data-value="3"]').click();
                await page.locator('video[data-player="interview-0"]').waitFor();
                assert.equal(await page.locator('.ceremony-interview-screen [data-file-key]').count(),0);
                assert.equal((await page.locator('.ceremony-interview-screen .episode-meta .eyebrow').textContent()).trim(),'ВОПРОСЫ И ОТВЕТЫ');
                assert.equal(await page.locator('.media-prompt').count(),0);
                await page.locator('video[data-player="interview-0"]').evaluate(v=>{v.volume=0.25;});
                await page.waitForFunction(()=>JSON.parse(localStorage.getItem('golden-wedding-video-sound-v1')||'{}').volume===0.25);
                await page.locator('[data-action="interview-next"]').click();
                await page.locator('.gold-wipe-item').waitFor({state:'visible'});
                await page.locator('.gold-wipe-item').waitFor({state:'detached'});
                await page.locator('video[data-player="interview-1"]').waitFor();
                assert(await page.locator('video[data-player="interview-1"]').evaluate(v=>v.paused));
                assert.equal(await page.locator('video[data-player="interview-1"]').evaluate(v=>v.volume),.25);
                assert(await page.locator('.video-switcher .clip-button.active').textContent()==='02');
                if(viewport.width<=800) await page.locator('#mobile-stage-select').selectOption('4');
                else await page.locator('.section-item[data-value="4"]').click();
                await page.locator('.question-card').waitFor();
                const movieFrame=await page.locator('.stage-content').evaluate(el=>({
                  height:el.getBoundingClientRect().height,
                  stageHeight:el.closest('.stage').getBoundingClientRect().height,
                  branchTop:parseFloat(getComputedStyle(el,'::before').top),
                  branchLeft:parseFloat(getComputedStyle(el,'::before').left)
                }));
                assert(movieFrame.branchTop>=0&&movieFrame.branchLeft>=0,'Film ornaments escape frame');
                if(viewport.width>800)assert(movieFrame.height<movieFrame.stageHeight*.97,'Film frame still fills the full stage');
                await page.locator('[data-action="movie-reveal"]').click();
                await page.locator('.question-card .answer-panel').waitFor();
                // The melody show uses ONE local recording: a verse that pauses
                // automatically at the chorus, then a revealed answer starts it again.
                if(viewport.width<=800)await page.locator('#mobile-stage-select').selectOption('5');
                else await page.locator('.section-item[data-value="5"]').click();
                await page.locator('.melody-game-screen').waitFor();
                assert((await page.locator('.melody-game-screen').textContent()).includes('ТРЕК 01 / 20'));
                assert.equal((await page.locator('.melody-game-screen .episode-meta h1').textContent()).trim(),'Продолжи песню');
                assert.equal(await page.locator('.melody-file-status').count(),0);
                // Emergency song settings must remain accessible in TV/presentation mode.
                await page.evaluate(()=>document.body.classList.add('presentation'));
                assert(await page.locator('.melody-setup summary').isVisible(),'MP3 settings control is hidden in show mode');
                await page.locator('.melody-setup summary').click();
                assert(await page.locator('.melody-setup').evaluate(el=>el.open),'The settings drawer should open');
                assert.equal(await page.locator('.melody-setup [data-melody-setting="verseEnd"]').count(),1);
                assert.equal(await page.locator('.melody-setup [data-file-key="melody-0"]').count(),1);
                await page.locator('.melody-setup summary').click();
                await page.evaluate(()=>document.body.classList.remove('presentation'));
                const alignment=await page.evaluate(()=>{
                  const title=document.querySelector('.melody-game-screen .episode-meta');
                  const player=document.querySelector('.melody-game-layout');
                  return Math.abs(title.getBoundingClientRect().left-player.getBoundingClientRect().left);
                });
                assert(alignment<25,'Music title should align with the playback panel');
                assert.equal((await page.locator('#mobile-stage-select option[value="5"]').textContent()).includes('Продолжи песню'),true);
                await page.evaluate(()=>{
                  const samples=24000,rate=8000;
                  const buffer=new ArrayBuffer(44+samples*2);
                  const v=new DataView(buffer);
                  const str=(n,s)=>{for(let i=0;i<s.length;i++)v.setUint8(n+i,s.charCodeAt(i));};
                  str(0,'RIFF');v.setUint32(4,36+samples*2,true);
                  str(8,'WAVE');str(12,'fmt ');
                  v.setUint32(16,16,true);v.setUint16(20,1,true);
                  v.setUint16(22,1,true);v.setUint32(24,rate,true);
                  v.setUint32(28,rate*2,true);v.setUint16(32,2,true);
                  v.setUint16(34,16,true);str(36,'data');
                  v.setUint32(40,samples*2,true);
                  for(let i=0;i<samples;i++)
                    v.setInt16(44+i*2,Math.round(Math.sin(i*2*Math.PI*220/rate)*4000),true);
                  const wav=URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
                  const old=window.WeddingCloud.fileURL;
                  window.WeddingCloud.fileURL=(key,fallback)=>key==='melody-0'?wav:old(key,fallback);
                  const originalHasFile=window.WeddingCloud.hasFile;
                  window.WeddingCloud.hasFile=key=>key==='melody-0'||originalHasFile(key);
                });
                await page.locator('.melody-setup summary').click();
                await page.locator('[data-melody-setting="answer"]').fill('Тестовый артист — Тестовая песня');
                await page.locator('[data-melody-setting="answer"]').press('Tab');
                await page.locator('[data-melody-setting="verseStart"]').fill('0.1');
                await page.locator('[data-melody-setting="verseStart"]').press('Tab');
                await page.locator('[data-melody-setting="chorusStart"]').fill('1.2');
                await page.locator('[data-melody-setting="chorusStart"]').press('Tab');
                await page.locator('[data-melody-volume]').evaluate(el=>{
                  el.value='34';el.dispatchEvent(new Event('input',{bubbles:true}));
                });
                assert.equal(await page.locator('#shared-audio').evaluate(a=>a.volume),.34);
                assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('golden-wedding-melody-cues-v2'))['0'].answer),'Тестовый артист — Тестовая песня');
                await page.locator('[data-action="melody-clue"]').click();
                await page.waitForFunction(()=>document.querySelector('[data-melody-status]')?.textContent.includes('Ждём ответы гостей'),{timeout:7000});
                assert(await page.locator('#shared-audio').evaluate(a=>a.paused),'Verse must stop before chorus');
                await page.locator('[data-action="melody-reveal"]').click();
                await page.locator('.melody-big-answer').waitFor();
                assert.equal(await page.locator('.melody-big-answer').textContent(),'Тестовый артист — Тестовая песня');
                assert(await page.locator('#shared-audio').evaluate(a=>a.currentTime>=1.15),'Chorus must start at its cue');
                await page.locator('[data-action="melody-restart"]').click();
                assert(!await page.locator('.melody-big-answer').count());
                // Regression: the chorus is earlier in the song than the quiz verse.
                // The reveal must still seek backwards to the first chorus.
                // The settings drawer now intentionally stays open across player renders.
                if(!await page.locator('.melody-setup').evaluate(el=>el.open)){
                  await page.locator('.melody-setup summary').click();
                }
                await page.locator('[data-melody-setting="verseStart"]').fill('0.6');
                await page.locator('[data-melody-setting="verseStart"]').press('Tab');
                await page.locator('[data-melody-setting="verseEnd"]').fill('1.5');
                await page.locator('[data-melody-setting="verseEnd"]').press('Tab');
                await page.locator('[data-melody-setting="chorusStart"]').fill('0.2');
                await page.locator('[data-melody-setting="chorusStart"]').press('Tab');
                const inverted=await page.evaluate(()=>JSON.parse(localStorage.getItem('golden-wedding-melody-cues-v2'))['0']);
                assert.deepEqual([inverted.verseStart,inverted.verseEnd,inverted.chorusStart],[.6,1.5,.2]);
                await page.locator('[data-action="melody-clue"]').click();
                await page.waitForFunction(()=>document.querySelector('[data-melody-status]')?.textContent.includes('Ждём ответы гостей'),null,{timeout:7000});
                assert(await page.locator('#shared-audio').evaluate(a=>a.paused),'Later verse must stop at independent verse end');
                assert(Math.abs((await page.locator('#shared-audio').evaluate(a=>a.currentTime))-1.5)<.13,'Verse must stop at 1.5s');
                await page.locator('[data-action="melody-reveal"]').click();
                await page.locator('.melody-big-answer').waitFor();
                assert((await page.locator('#shared-audio').evaluate(a=>a.currentTime))>=.18,'Revealed chorus must seek backwards to 0.2s');
                await page.locator('[data-action="melody-restart"]').click();
                // Three in-person competitions are title screens: no demo answers,
                // descriptions, image uploads or per-question controls.
                const ornaments=[];
                for(const [index,title,asset] of [[6,'Парный конкурс','ornament-pairs.svg'],[7,'Конкурс «Салаты и закуски»','ornament-harvest.svg'],[8,'Конкурс «Загаданное слово»','ornament-word.svg']]){
                  if(viewport.width<=800)await page.locator('#mobile-stage-select').selectOption(String(index));
                  else await page.locator('.section-item[data-value="'+index+'"]').click();
                  await page.waitForFunction(expected=>
                    document.querySelector('.announcement-title')?.textContent.trim()===expected,title,{timeout:10000});
                  assert.equal((await page.locator('.announcement-title').textContent()).trim(),title);
                  assert.equal(await page.locator('.announcement-screen button').count(),0);
                  assert.equal(await page.locator('.announcement-screen [data-file-key]').count(),0);
                  assert.equal(await page.locator('.announcement-screen img').count(),0);
                  assert.equal(await page.locator('.announcement-screen p').count(),0);
                  const decoration=await page.locator('.announcement-screen').evaluate(el=>{
                    const style=getComputedStyle(el,'::before');
                    const second=getComputedStyle(el,'::after');
                    const title=el.querySelector('.announcement-title').getBoundingClientRect();
                    const box=el.getBoundingClientRect();
                    const artWidth=parseFloat(style.width),artHeight=parseFloat(style.height);
                    const left=style.left==='auto'?box.width-parseFloat(style.right)-artWidth:parseFloat(style.left);
                    const top=style.top==='auto'?box.height-parseFloat(style.bottom)-artHeight:parseFloat(style.top);
                    const intersect=Math.max(0,Math.min(title.right,box.left+left+artWidth)-Math.max(title.left,box.left+left))*
                      Math.max(0,Math.min(title.bottom,box.top+top+artHeight)-Math.max(title.top,box.top+top));
                    return {image:style.backgroundImage,secondDisplay:second.display,
                      left,top,artWidth,artHeight,intersect};
                  });
                  assert(decoration.image.includes(asset),'Announcement ornament does not match '+title);
                  assert.equal(decoration.secondDisplay,'none','Mirrored ornament must be removed');
                  assert(decoration.left>=0&&decoration.top>=0,'Announcement ornament escapes its frame');
                  assert(decoration.artWidth>=110&&decoration.artHeight>=160,'The main artwork must be visible from a television');
                  assert(decoration.intersect<220,'The ornament covers the announcement heading');
                  ornaments.push(decoration.image);
                  assert((await page.locator('.announcement-title').evaluate(el=>getComputedStyle(el).fontSize))!=='16px');
                }
                assert.equal(new Set(ornaments).size,3,'Each announcement must have distinct ornaments');
                // Silhouette remains interactive (20 seconds / two rounds) but media
                // upload and cloud notices must be absent from its show screen.
                if(viewport.width<=800)await page.locator('#mobile-stage-select').selectOption('9');
                else await page.locator('.section-item[data-value="9"]').click();
                await page.locator('.silhouette-board').waitFor();
                assert.equal(await page.locator('.stage-content [data-file-key]').count(),0);
                assert.equal(await page.locator('.stage-content .cloud-sync-note').count(),0);
                // Test an uploaded image with an isolated in-memory visual, not a network file.
                await page.evaluate(()=>{
                  const original=window.WeddingCloud.fileURL;
                  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430"><rect width="800" height="430" fill="#FEF4DC"/></svg>';
                  const picture='data:image/svg+xml,'+encodeURIComponent(svg);
                  window.WeddingCloud.fileURL=(key,fallback)=>key.startsWith('silhouette-')?picture:original(key,fallback);
                  document.dispatchEvent(new Event('wedding-cloud-updated'));
                });
                await page.clock.install();
                assert((await page.locator('[data-action="silhouette-start"]').textContent()).includes('20 сек'));
                assert.equal(await page.locator('[data-action="silhouette-answer"]').count(),0);
                await page.locator('[data-action="silhouette-start"]').click();
                await page.locator('.silhouette-image-board img').waitFor();
                await page.locator('#timer-display').waitFor();
                assert(parseFloat(await page.locator('#timer-display').textContent())<=20);
                assert.equal(await page.locator('[data-action="silhouette-answer"]').count(),0,'Answers must be hidden during countdown');
                assert.equal(await page.locator('.stage-content [data-file-key]').count(),0);
                await page.clock.fastForward(20100);
                await page.locator('.silhouette-covered').waitFor();
                assert.equal(await page.locator('.silhouette-answers-board').count(),0,'Answers are hidden after the timer');
                await page.locator('[data-action="silhouette-answer"]').click();
                await page.locator('.silhouette-answers-board').waitFor();
                const round1=await page.locator('.silhouette-answer-item').allTextContents();
                assert.deepEqual(round1.map(x=>x.trim()),['12Кукуруза','10Бутылки','8Индюки','10Тыквы','4Яблоки']);
                await page.locator('[data-action="silhouette-answer"]').click();
                assert.equal(await page.locator('.silhouette-answers-board').count(),0,'Hide answers is available');
                await page.locator('[data-action="silhouette-next"]').click();
                await page.locator('.silhouette-covered strong').waitFor();
                await page.waitForFunction(()=>document.querySelector('.silhouette-covered strong')?.textContent==='Раунд 2');
                assert.equal(await page.locator('[data-action="silhouette-answer"]').count(),0,'Next round must not inherit answers');
                await page.locator('[data-action="silhouette-start"]').click();
                await page.locator('.silhouette-image-board img').waitFor();
                await page.clock.fastForward(20100);
                await page.locator('.silhouette-covered').waitFor();
                await page.locator('[data-action="silhouette-answer"]').click();
                await page.locator('.silhouette-answers-board').waitFor();
                const round2=await page.locator('.silhouette-answer-item').allTextContents();
                assert.deepEqual(round2.map(x=>x.trim()),['8Пятки','5Звоны','4Листья','5Кристаллы','5Приставки','4Обезьяны','9Усы']);
                // Closing credits must be readable and the rolling film credits
                // must pause/resume without starting over or re-rendering.
                if(viewport.width<=800) await page.locator('#mobile-stage-select').selectOption('10');
                else await page.locator('.section-item[data-value="10"]').click();
                await page.locator('.credits-screen').waitFor();
                assert.equal(await page.locator('.credits-headline h1').textContent(),
                  'История любви длиною в полвека');
                await page.waitForFunction(()=>{
                  const inner=document.querySelector('.credits-inner');
                  return inner && inner.getAnimations().length>0;
                });
                await page.locator('[data-action="credits-pause"]').click();
                assert.equal(await page.locator('.credits-inner').evaluate(el=>el.getAnimations()[0]?.playState),'paused');
                await page.locator('[data-action="credits-pause"]').click();
                assert.equal(await page.locator('.credits-inner').evaluate(el=>el.getAnimations()[0]?.playState),'running');
                await page.locator('[data-action="credits-restart"]').click();
                await page.waitForFunction(()=>document.querySelector('.credits-inner')?.getAnimations()[0]?.playState==='running');
                assert.equal(await page.locator('.credits-lead h3').textContent(), 'Павлу Семёновичуи Ольге Леонидовне');
                assert.deepEqual(errors,[],`Page errors on viewport ${viewport.width}`);
                console.log(`PASS ${viewport.width}x${viewport.height}: welcome reveal, backdrop, menu, quiz, credits playback`);
                await page.close();
              }
            }finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
