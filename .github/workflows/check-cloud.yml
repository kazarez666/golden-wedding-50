name: Check website JavaScript and cloud media integration
on:
  push:
    paths:
      - 'app.js'
      - 'data.js'
      - 'cloud-media.js'
      - 'cloud-media-config.js'
      - 'index.html'
      - '.github/workflows/check-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check app.js
          node --check data.js
          node --check cloud-media.js
          node --check cloud-media-config.js
      - name: Check Cloudinary integration wiring
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const index=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const cloud=fs.readFileSync('cloud-media.js','utf8');
          const config=fs.readFileSync('cloud-media-config.js','utf8');
          const scripts=['cloud-media-config.js','cloud-media.js','data.js','app.js'];
          let last=-1;
          for(const script of scripts){
            const pos=index.indexOf('src="'+script);
            assert(pos>last, script+' missing or scripts loaded in the wrong order');
            last=pos;
          }
          const sandbox={window:{}};
          vm.runInNewContext(config,sandbox,{timeout:1000});
          assert.equal(sandbox.window.WEDDING_MEDIA_CONFIG?.provider,'cloudinary');
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.cloudName,/^[a-zA-Z0-9_-]+$/);
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.uploadPreset,/^[a-zA-Z0-9_-]+$/);
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.tag,/^[a-zA-Z0-9_-]+$/);
          assert(app.includes('await window.WeddingCloud.upload(key,file)'),'upload handler not connected');
          assert(app.includes('window.WeddingCloud?.fileURL('),'video player not connected');
          assert(app.includes('video.addEventListener(\'volumechange\''),'video volume persistence missing');
          assert(app.includes('function openAmbient()'),'intermission control missing');
          assert(index.includes('id="ambient-screen"'),'intermission screen missing');
          assert(index.includes('polish-background-v0.9.css'),'latest palette override missing');
          assert(cloud.includes('https://api.cloudinary.com/v1_1/'),'Cloudinary upload endpoint missing');
          assert(cloud.includes('/video/upload'),'video upload endpoint missing');
          assert(cloud.includes('/video/list/'),'cross-device manifest endpoint missing');
          assert(cloud.includes('XMLHttpRequest'),'upload progress client missing');
          assert(!cloud.includes("workerUrl"),'old Cloudflare Worker integration remains active');
          console.log('Cloudinary client wiring OK. Live uploads and permissions require a separate browser test.');
          EOF
