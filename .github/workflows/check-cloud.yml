name: Check website JavaScript and cloud media integration
on:
  push:
    paths:
      - 'app.js'
      - 'data.js'
      - 'cloud-media.js'
      - 'cloud-media-config.js'
      - 'index.html'
      - 'burgundy-background-v1.0.css'
      - 'final-layout-v1.1.css'
      - '.github/workflows/check-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check app.js
          node --check data.js
          node --check cloud-media.js
          node --check cloud-media-config.js
      - name: Check Cloudinary integration wiring
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const index=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('app.js','utf8');
          const cloud=fs.readFileSync('cloud-media.js','utf8');
          const data=fs.readFileSync('data.js','utf8');
          const config=fs.readFileSync('cloud-media-config.js','utf8');
          const scripts=['cloud-media-config.js','cloud-media.js','data.js','app.js'];
          let last=-1;
          for(const script of scripts){
            const pos=index.indexOf('src="'+script);
            assert(pos>last, script+' missing or scripts loaded in the wrong order');
            last=pos;
          }
          const sandbox={window:{}};
          vm.runInNewContext(config,sandbox,{timeout:1000});
          assert.equal(sandbox.window.WEDDING_MEDIA_CONFIG?.provider,'cloudinary');
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.cloudName,/^[a-zA-Z0-9_-]+$/);
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.uploadPreset,/^[a-zA-Z0-9_-]+$/);
          assert.match(sandbox.window.WEDDING_MEDIA_CONFIG.tag,/^[a-zA-Z0-9_-]+$/);
          assert(app.includes('await window.WeddingCloud.upload(key,file)'),'upload handler not connected');
          assert(app.includes('window.WeddingCloud?.fileURL('),'video player not connected');
          assert(app.includes('video.addEventListener(\'volumechange\''),'video volume persistence missing');
          assert(app.includes('function openAmbient()'),'intermission control missing');
          assert(index.includes('id="ambient-screen"'),'intermission screen missing');
          assert(index.includes('polish-background-v0.9.css'),'previous palette override missing');
          assert(index.includes('burgundy-background-v1.0.css'),'new burgundy intermission style missing');
          assert(cloud.includes('const isAudio = key'),'MP3 cloud support missing');
          assert(app.includes('WeddingCloud?.isMedia(key)'),'audio selectors not connected to cloud');
          assert(cloud.includes('https://api.cloudinary.com/v1_1/'),'Cloudinary upload endpoint missing');
          assert(cloud.includes("(imageFile ? 'image' : 'video')"),'Dynamic Cloudinary endpoint selector missing');
          assert(cloud.includes("loadList('image')"),'Image list endpoint missing');
          assert(cloud.includes("const isImage = key"),'Silhouette Cloudinary slot support missing');
          assert(app.includes('Загрузить картинку раунда'),'Silhouette image picker missing');
          assert(!app.includes('function silhouetteSVG'),'Obsolete demo silhouettes still present');
          assert(index.includes('id="host-menu"'),'Unified controls menu missing');
          assert(index.includes('final-layout-v1.1.css'),'Final backdrop layout missing');
          assert(cloud.includes("'/' + kind + '/list/'"),'Dynamic video/image manifests missing');
          assert(cloud.includes('XMLHttpRequest'),'upload progress client missing');
          assert(!cloud.includes("workerUrl"),'old Cloudflare Worker integration remains active');
          // Simulate a second device reading a shared MP3 from Cloudinary's public asset list.
          const simulated={window:{WEDDING_MEDIA_CONFIG:{provider:'cloudinary',cloudName:'testcloud',uploadPreset:'testpreset',tag:'test_wedding'}},
            document:{addEventListener(){},dispatchEvent(){}},Event:class {},
            fetch:async(url)=>({ok:true,status:200,json:async()=>({resources:url.includes('/image/list/')?[
              {public_id:'test/round1',format:'png',version:6,context:{custom:{slot:'silhouette-0'}}},
              {public_id:'test/round2',format:'jpg',version:7,context:{custom:{slot:'silhouette-1'}}}
            ]:[
              {public_id:'test/march',format:'mp3',version:5,context:{custom:{slot:'march'}}},
              {public_id:'test/melody',format:'mp3',version:8,context:{custom:{slot:'melody-7'}}},
              {public_id:'test/melody20',format:'mp3',version:10,context:{custom:{slot:'melody-19'}}}
            ]})})};
          vm.runInNewContext(cloud,simulated,{timeout:2000});
          assert(simulated.window.WeddingCloud.isMedia('march'));
          assert(simulated.window.WeddingCloud.isMedia('melody-7'));
          assert(simulated.window.WeddingCloud.isMedia('melody-8'));
          assert(simulated.window.WeddingCloud.isMedia('melody-19'));
          assert(!simulated.window.WeddingCloud.isMedia('melody-20'));
          assert(!simulated.window.WeddingCloud.isMedia('melody--1'));
          assert(!simulated.window.WeddingCloud.isMedia('melody-019'));
          assert(simulated.window.WeddingCloud.isImage('silhouette-0'));
          assert(simulated.window.WeddingCloud.isImage('silhouette-1'));
          assert(!simulated.window.WeddingCloud.isImage('silhouette-2'));
          assert(await simulated.window.WeddingCloud.refresh(),'Public MP3 list parsing failed');
          assert(simulated.window.WeddingCloud.fileURL('march','missing.mp3').endsWith('.mp3'));
          assert(simulated.window.WeddingCloud.fileURL('melody-7','missing.mp3').endsWith('.mp3'));
          assert(simulated.window.WeddingCloud.fileURL('melody-19','missing.mp3').includes('melody20.mp3'));
          assert.equal(simulated.window.WeddingCloud.fileURL('melody-20','missing.mp3'),'missing.mp3');
          assert(simulated.window.WeddingCloud.fileURL('silhouette-0','').endsWith('.png'));
          assert(simulated.window.WeddingCloud.fileURL('silhouette-1','').endsWith('.jpg'));
          const contentEnv={window:{}};
          vm.runInNewContext(data,contentEnv,{timeout:2000});
          assert.equal(contentEnv.window.SITE_DATA.movies.length,10,'Expected exactly 10 movie clues');
          assert.equal(contentEnv.window.SITE_DATA.melodies.length,20,'Expected exactly 20 melody tracks');
          assert.equal(contentEnv.window.SITE_DATA.melodies[19].src,'media/melodies/20.mp3');
          assert.equal(contentEnv.window.SITE_DATA.movies[0].answer,'Иван Васильевич меняет профессию');
          assert.equal(contentEnv.window.SITE_DATA.movies[9].answer,'Формула любви');
          console.log('20 MP3 melody slots, Cloudinary sync and movie clues verified by mock. Real uploads still need Cloudinary configuration.');
          EOF
